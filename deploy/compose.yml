name: blueflare

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18+ stores PGDATA below the parent mount.
      # A PostgreSQL 17 rollback uses a fresh volume restored from backup.
      - ${POSTGRES_VOLUME:-postgres18-data}:${POSTGRES_MOUNT:-/var/lib/postgresql}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  valkey:
    image: ${VALKEY_IMAGE:-valkey/valkey:9.1.1-alpine}
    restart: unless-stopped
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${VALKEY_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  image-cache-init:
    # alpine thay vì build image backend: service này chỉ mkdir + chown.
    # alpine không có user `node`, phải dùng uid:gid số — 1000:1000 là `node`
    # trong node:22-bookworm-slim mà api/worker chạy.
    image: alpine:3
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data/images && chown -R 1000:1000 /data/images"]
    volumes:
      - ${IMAGE_CACHE_HOST_DIR:-./data/images}:/data/images

  api:
    build:
      context: ${BLUEFLARE_SRC:-/home/ubuntu/blueflare}/backend
    restart: unless-stopped
    env_file: ${BLUEFLARE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      FRONTEND_REVALIDATE_SECRET: ${FRONTEND_REVALIDATE_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      image-cache-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PORT:-3200}:3200"
    volumes:
      - ${IMAGE_CACHE_HOST_DIR:-./data/images}:/data/images
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - backend


  frontend:
    build:
      context: ${BLUEFLARE_SRC:-/home/ubuntu/blueflare}
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    # Lets FEATURE_*/HOME_SECTION_LIMIT flags reach the frontend at runtime;
    # the fixed values below still take precedence over anything set in .env.
    env_file: ${BLUEFLARE_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      # .env's PORT is the api service's port; without this override the
      # frontend's Next standalone server would inherit it via env_file
      # above and bind 3200 instead of the 3000 the healthcheck/port
      # mapping below expect.
      PORT: "3000"
      INTERNAL_CATALOG_URL: http://api:3200
      CATALOG_BASE_URL: http://api:3200
      FRONTEND_REVALIDATE_SECRET: ${FRONTEND_REVALIDATE_SECRET:-}
      FRONTEND_REVALIDATE_URL: http://frontend:3000/api/internal/revalidate
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - backend

  worker:
    build:
      context: ${BLUEFLARE_SRC:-/home/ubuntu/blueflare}/backend
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    env_file: ${BLUEFLARE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      FRONTEND_REVALIDATE_SECRET: ${FRONTEND_REVALIDATE_SECRET:-}
      FRONTEND_REVALIDATE_URL: http://frontend:3000/api/internal/revalidate
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  # Reserved for a restore-based PostgreSQL 17 rollback.
  postgres-data:
  postgres18-data:
  valkey-data:
