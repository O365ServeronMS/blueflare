<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <script src="./image-slot.js"></script>
  <style>
    body { margin: 0; background: #000; }
    .row-scroll::-webkit-scrollbar { display: none; }
    .poster { cursor: pointer; }
    .navlink:hover { color: #fff !important; }
  </style>
</helmet>

<div style="min-height:100vh;display:flex;justify-content:center;padding:40px 0;background:#1a1a1a;">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ true }}" hint-size="390px,844px">
    <div style="background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;min-height:100%;display:flex;flex-direction:column;padding-top:62px;">

      <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 16px 4px;">
        <svg width="22" height="24" viewBox="0 0 20 22"><path d="M10 0 C4 6 2 10 2 14 C2 18.4 5.6 22 10 22 C14.4 22 18 18.4 18 14 C18 10 16 6 10 0 Z M10 5 C13 9 15 11.5 15 14.2 C15 16.8 12.8 19 10 19 C7.2 19 5 16.8 5 14.2 C5 11.5 7 9 10 5 Z" fill="#E4312A"></path></svg>
        <div style="display:flex;align-items:center;gap:16px;">
          <span style="font-size:20px;">⇄</span>
          <div style="width:24px;height:24px;background:#414141;border-radius:4px;flex-shrink:0;"></div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:22px;padding:12px 16px 16px;font-size:14px;font-weight:500;">
        <span class="navlink" onClick="{{ setTab }}" data-tab="home" style="cursor:pointer;color:{{ tabColor.home }};">Trang chủ</span>
        <span class="navlink" onClick="{{ setTab }}" data-tab="films" style="cursor:pointer;color:{{ tabColor.films }};">Phim lẻ</span>
        <span class="navlink" onClick="{{ setTab }}" data-tab="series" style="cursor:pointer;color:{{ tabColor.series }};">Phim bộ</span>
        <span class="navlink" style="cursor:pointer;color:#b3b3b3;margin-left:auto;">▾</span>
      </div>

      <sc-if value="{{ isHomeTab }}">
        <div style="position:relative;width:100%;height:460px;overflow:hidden;flex-shrink:0;">
          <image-slot id="mobile-hero" shape="rect" fit="cover" placeholder="Ảnh nền phim nổi bật" style="width:100%;height:100%;position:absolute;inset:0;"></image-slot>
          <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.5) 55%, #000 100%);pointer-events:none;"></div>
          <div style="position:absolute;left:0;right:0;bottom:16px;padding:0 20px;text-align:center;">
            <div style="display:inline-block;background:#E4312A;color:#fff;font-size:11px;font-weight:700;letter-spacing:0.05em;padding:3px 9px;border-radius:4px;margin-bottom:12px;text-transform:uppercase;">Series</div>
            <div style="font-weight:900;font-size:34px;line-height:1.17;color:#fff;text-transform:uppercase;margin-bottom:10px;">Điểm Đến<br/>Vô Định</div>
            <div style="font-size:13px;color:#b3b3b3;">Bí ẩn · Tâm lý · 8 Tập</div>
          </div>
        </div>

        <div style="display:flex;justify-content:space-around;align-items:flex-start;padding:20px 16px;">
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#b3b3b3;cursor:pointer;">
            <div style="width:26px;height:26px;background:#414141;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;">+</div>
            Danh sách
          </div>
          <button style="display:flex;align-items:center;gap:8px;background:#E4312A;color:#fff;border:none;font-weight:700;font-size:15px;padding:10px 28px;border-radius:4px;">▶ Play</button>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#b3b3b3;cursor:pointer;">
            <div style="width:26px;height:26px;background:#414141;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;">ⓘ</div>
            Info
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ isHomeTab }}">
        <div style="padding:8px 16px 32px;display:flex;flex-direction:column;gap:28px;">
          <sc-for list="{{ rows }}" as="row" hint-placeholder-count="2">
            <div>
              <div style="font-size:17px;font-weight:700;margin-bottom:12px;">{{ row.title }}</div>
              <div class="row-scroll" style="display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;height:160px;">
                <sc-for list="{{ row.items }}" as="movie" hint-placeholder-count="4">
                  <div class="poster" style="flex-shrink:0;width:110px;height:160px;position:relative;overflow:visible;">
                    <image-slot id="{{ movie.slotId }}" shape="rect" fit="cover" placeholder="{{ movie.title }}" style="width:110px;height:160px;"></image-slot>
                    <sc-if value="{{ movie.rank }}">
                      <div style="position:absolute;left:-4px;bottom:0;font-size:56px;font-weight:900;color:#000;-webkit-text-stroke:2px #fff;line-height:1;pointer-events:none;">{{ movie.rank }}</div>
                    </sc-if>
                  </div>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ isGridTab }}">
        <div style="padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
          <sc-for list="{{ gridItems }}" as="movie" hint-placeholder-count="9">
            <div class="poster">
              <image-slot id="{{ movie.slotId }}" shape="rect" fit="cover" placeholder="{{ movie.title }}" style="width:100%;aspect-ratio:2/3;"></image-slot>
            </div>
          </sc-for>
        </div>
      </sc-if>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: 'home' };

  movies = [
    { id: 'm1', title: 'Điểm Đến Vô Định', category: 'films', badge: true },
    { id: 'm2', title: 'Mắt Khóa', category: 'films', badge: false },
    { id: 'm3', title: 'Bác Sĩ Tốt', category: 'films', badge: false },
    { id: 'm4', title: 'Woodstock 99', category: 'films', badge: true },
    { id: 'm5', title: 'Kẻ Săn Đêm', category: 'series', badge: true },
    { id: 'm6', title: 'Ánh Sáng Cuối Ngày', category: 'series', badge: false },
    { id: 'm7', title: 'Brooklyn 9-9', category: 'series', badge: false },
  ];

  setTab = (e) => this.setState({ tab: e.currentTarget.dataset.tab });

  toItems(list) {
    return list.map(m => ({ title: m.title, slotId: 'm-poster-' + m.id }));
  }

  renderVals() {
    const tab = this.state.tab;
    const tabColor = {
      home: tab === 'home' ? '#fff' : '#b3b3b3',
      films: tab === 'films' ? '#fff' : '#b3b3b3',
      series: tab === 'series' ? '#fff' : '#b3b3b3',
    };
    const films = this.movies.filter(m => m.category === 'films');
    const series = this.movies.filter(m => m.category === 'series');
    const trending = this.movies.filter(m => m.badge).map((m, i) => Object.assign({}, m, { rank: i + 1 }));

    const isHomeTab = tab === 'home';
    const isGridTab = !isHomeTab;
    const gridItems = tab === 'films' ? this.toItems(films) : tab === 'series' ? this.toItems(series) : [];

    const rows = [
      { title: 'Phim đang được xem nhiều', items: trending.map(m => ({ title: m.title, slotId: 'm-poster-' + m.id, rank: m.rank })) },
      { title: 'Phim lẻ nổi bật', items: this.toItems(films) },
      { title: 'Phim bộ nổi bật', items: this.toItems(series) },
    ];

    return { tabColor, setTab: this.setTab, rows, isHomeTab, isGridTab, gridItems };
  }
}
</script>
</body>
</html>
